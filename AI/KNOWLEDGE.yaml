meta:
  project: "ha-file-editor-plus"
  source_of_truth: "AI/KNOWLEDGE.yaml"
  updated_at: "2026-02-19T09:09:40Z"

commands:
  frontend_build:
    - "cd file_editor_plus/frontend"
    - "npm ci"
    - "npm run build"
  frontend_typecheck:
    - "cd file_editor_plus/frontend"
    - "npm ci"
    - "npm run -s typecheck"
  backend_tests_docker:
    - "docker run --rm -v \"$PWD/file_editor_plus/backend:/app\" -w /app python:3.12-alpine sh -lc \"python -m pip install -r requirements.txt >/dev/null && python -m unittest -q\""
  addon_lifecycle:
    update: "docker exec hassio_cli ha apps update local_file_editor_plus"
    rebuild: "docker exec hassio_cli ha apps rebuild local_file_editor_plus"
    restart: "docker exec hassio_cli ha apps restart local_file_editor_plus"
    supervisor_logs: "docker exec hassio_cli ha supervisor logs -n 220"

entities:
  - id: "repo:root"
    type: "repository"
    name: "ha-file-editor-plus"
    path: "."
    notes: "Repo add-on Home Assistant con slug `file_editor_plus`."

  - id: "addon:file_editor_plus"
    type: "addon"
    name: "File Editor Plus"
    path: "file_editor_plus/config.yaml"
    notes: "Ingress abilitato; mount /config:rw; permessi Supervisor/Core API (vedi manifest)."

  - id: "backend:api"
    type: "service"
    name: "FastAPI backend"
    path: "file_editor_plus/backend/app.py"
    notes: "Serve API FS + proxy HA + cloud (Google Drive); runtime uvicorn su 0.0.0.0:8099 via s6."

  - id: "backend:gdrive"
    type: "module"
    name: "Google Drive Cloud Backup"
    path: "file_editor_plus/backend/app.py"
    notes: "Device Flow + upload ZIP di /config su Drive; storage `/data/gdrive/*`; endpoints `/api/cloud/gdrive/*`."

  - id: "backend:s6-run"
    type: "runtime"
    name: "s6 service run"
    path: "file_editor_plus/rootfs/etc/services.d/web/run"
    notes: "Avvio uvicorn; contesto add-on."

  - id: "frontend:app"
    type: "frontend"
    name: "Lit app-root"
    path: "file_editor_plus/frontend/src/app-root.ts"
    notes: "UI principale (topbar, sidebar, editor, status, menu, docs link)."

  - id: "frontend:entry"
    type: "frontend"
    name: "Vite entrypoint"
    path: "file_editor_plus/frontend/src/main.ts"
    notes: "Import e bootstrap del web component root."

  - id: "docs:user"
    type: "docs"
    name: "Documentazione utente (Markdown)"
    path: "file_editor_plus/docs"
    notes: "Layout multilingua `docs/<lang>/*.md` (it/en/de/fr/es)."

  - id: "docs:audit_ui_nav"
    type: "audit"
    name: "UI nav audit (Topbar + Sidebar)"
    path: "AI/AUDITS/UI_NAV_AUDIT.md"
    notes: "Mappa voci UI -> handler -> servizi/endpoints; include sezione NOT CONNECTED."

  - id: "frontend:i18n"
    type: "module"
    name: "UI i18n module"
    path: "file_editor_plus/frontend/src/i18n/index.ts"
    notes: "Locale persistito in localStorage key `locale`."

relations:
  - from: "addon:file_editor_plus"
    type: "runs"
    to: "backend:api"

  - from: "backend:s6-run"
    type: "starts"
    to: "backend:api"

  - from: "backend:api"
    type: "serves"
    to: "frontend:app"

  - from: "backend:api"
    type: "serves"
    to: "docs:user"

  - from: "backend:api"
    type: "implements"
    to: "backend:gdrive"

  - from: "frontend:app"
    type: "uses"
    to: "frontend:i18n"

changes_log:
  - step_id: "SAVEAS_CLOUD-STEP-009"
    summary: "Aggiornati audit e knowledge: Save As ora crea file (non download) e Backup Cloud e' wired a UI+API gdrive."
    files:
      - "AI/AUDITS/UI_NAV_AUDIT.md"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci && npm run -s build"
    notes: "Audit: sezione NOT CONNECTED ora vuota; righe aggiornate per Save As e Cloud Backup."

  - step_id: "SAVEAS_CLOUD-STEP-008"
    summary: "Smoke add-on: restart eseguito; update non disponibile (nessun bump versione in questo epic)."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "docker exec hassio_cli ha apps update local_file_editor_plus"
      - "docker exec hassio_cli ha apps restart local_file_editor_plus"
      - "docker exec hassio_cli ha supervisor logs -n 120"
    notes: "Supervisor logs mostrano errore Ingress transitorio durante restart (connect failed), poi recupero."

  - step_id: "SAVEAS_CLOUD-STEP-007"
    summary: "Frontend: aggiunta UI Google Drive Backup (device auth + manual backup + schedule settings) e wiring `Backup -> Cloud`."
    files:
      - "file_editor_plus/frontend/src/app-root.ts"
      - "file_editor_plus/frontend/src/services/api.ts"
      - "file_editor_plus/frontend/src/i18n/it.json"
      - "file_editor_plus/frontend/src/i18n/en.json"
      - "file_editor_plus/frontend/src/i18n/fr.json"
      - "file_editor_plus/frontend/src/i18n/es.json"
      - "file_editor_plus/frontend/src/i18n/de.json"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s typecheck"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "La voce `Backup -> Cloud` non e' piu' disabled; il modal gestisce connect/polling (backend thread) e schedule via `/api/cloud/gdrive/schedule`."

  - step_id: "SAVEAS_CLOUD-STEP-006"
    summary: "Cloud scheduler: schedule (GET/PUT) + worker thread + retention solo per backup automatici."
    files:
      - "file_editor_plus/backend/app.py"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "docker run --rm -v \"$PWD/file_editor_plus/backend:/app\" -w /app python:3.12-alpine sh -lc \"python -m pip install -r requirements.txt >/dev/null && python -m unittest -q\""
      - "cd file_editor_plus/frontend && npm ci && npm run -s build"
    notes: "Auto backup: filename `config-auto-*.zip`; retention applicata list+delete oltre N (best-effort)."

  - step_id: "SAVEAS_CLOUD-STEP-005"
    summary: "Backend Google Drive: Device Authorization Flow + backup manuale ZIP di /config con upload in cartella fissa."
    files:
      - "file_editor_plus/backend/app.py"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/backend && (python -m pytest -q || true)"
      - "cd file_editor_plus/frontend && npm ci && npm run -s build"
    notes: "Nuovi endpoint: GET status, POST device/start|cancel|disconnect, POST backup. Token persistiti in `/data/gdrive/tokens.json`."

  - step_id: "SAVEAS_CLOUD-STEP-004"
    summary: "Decisione credenziali Google Drive: usare add-on options (`gdrive_client_id`) invece di Application Credentials."
    files:
      - "file_editor_plus/config.yaml"
      - "AI/DECISIONS.md"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "find . -maxdepth 3 -type d -name \"custom_components\" -o -name \"homeassistant\""
      - "rg -n -S \"application_credentials\" ."
    notes: "ADR 006: il repo non contiene `custom_components/`, quindi nessun wiring nativo ad Application Credentials."

  - step_id: "SAVEAS_CLOUD-STEP-003"
    summary: "Backend: reso distinguibile il conflitto create-only per Save As (HTTP 409 su file gia' esistente)."
    files:
      - "file_editor_plus/backend/app.py"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/backend && (python -m pytest -q || true)"
    notes: "Modificato `PUT /api/file` (FastAPI) per usare `409` quando `create_only=1` e la destinazione esiste."

  - step_id: "SAVEAS_CLOUD-STEP-002"
    summary: "Frontend: implementato Save As reale con dialog (cartella+nome) e gestione conflitto a 3 scelte; switch automatico al nuovo file."
    files:
      - "file_editor_plus/frontend/src/app-root.ts"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s typecheck"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Usa `PUT /api/file?create_only=1` per tentativo create; conflitto rilevato via HTTP 400/409 (dettaglio completato in STEP 003)."

  - step_id: "SAVEAS_CLOUD-STEP-001"
    summary: "Discovery Save As + Cloud Backup: mappati servizi FE ed endpoint/helper BE rilevanti per implementare save-as reale e backup cloud."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
      - "file_editor_plus/frontend/src/services/api.ts"
      - "file_editor_plus/frontend/src/app-root.ts"
      - "file_editor_plus/backend/app.py"
    commands:
      - "rg -n -S \"Save as|Save As|Export|Download\" file_editor_plus/frontend/src"
      - "rg -n -S \"src/services|api.ts\" file_editor_plus/frontend/src"
      - "rg -n -S \"\\\"/api\" file_editor_plus/backend"
      - "rg -n -S \"def safe_path|def atomic_write|def make_backup\" file_editor_plus/backend"
    notes: "Backend: `PUT /api/file` supporta `create_only=1` (oggi conflitto = HTTP 400 'File already exists'); helpers `safe_path/atomic_write` disponibili."

  - step_id: "UI_NAV_AUDIT-STEP-007"
    summary: "Knowledge: registrato audit UI nav come entita' e tracciato completamento epic audit/wiring."
    files:
      - "AI/KNOWLEDGE.yaml"
      - "AI/AI_TASKS.md"
      - "AI/AUDITS/UI_NAV_AUDIT.md"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Source of truth per audit: `AI/AUDITS/UI_NAV_AUDIT.md`."

  - step_id: "UI_NAV_AUDIT-STEP-006"
    summary: "Smoke add-on: eseguito update + restart di `local_file_editor_plus` e verificato esito OK da supervisor logs."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "docker exec hassio_cli ha apps update local_file_editor_plus"
      - "docker exec hassio_cli ha apps restart local_file_editor_plus"
      - "docker exec hassio_cli ha supervisor logs -n 80"
    notes: "Verifica statica: no 404/500 su Supervisor; verifica UI Ingress resta manuale."

  - step_id: "UI_NAV_AUDIT-STEP-005"
    summary: "Aggiornato audit UI Nav post-wiring: `Import…`/`Export…`/`Save as…` ora Connected; NOT CONNECTED resta solo per `Backup -> Cloud` (disabled)."
    files:
      - "AI/AUDITS/UI_NAV_AUDIT.md"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Audit allineato con lo stato attuale del wiring (STEP 004)."

  - step_id: "UI_NAV_AUDIT-STEP-004"
    summary: "Wiring Topbar File: `Import…` ora apre upload; `Export…` e `Save as…` scaricano il file attivo via backend."
    files:
      - "file_editor_plus/frontend/src/app-root.ts"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s typecheck"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Download usa endpoint esistente `/api/fs/download?path=...` (Ingress-safe via `apiBase`)."

  - step_id: "UI_NAV_AUDIT-STEP-003"
    summary: "Creato audit completo UI Nav (Topbar/Sidebar) con mapping a servizi/endpoints e sezione NOT CONNECTED."
    files:
      - "AI/AUDITS/UI_NAV_AUDIT.md"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Deliverable richiesto da `AI/AI_TASKS.md` (STEP 003)."

  - step_id: "UI_NAV_AUDIT-STEP-001"
    summary: "Raccolto inventario Topbar/Sidebar (voci UI e punti di rendering) per audit di wiring."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
      - "file_editor_plus/frontend/src/app-root.ts"
    commands:
      - "rg -n -S \"Topbar|TopBar|AppBar|Toolbar|Sidebar|Drawer\" file_editor_plus/frontend/src"
      - "rg -n -S \"menuItems|navItems|routes\" file_editor_plus/frontend/src"
      - "rg -n -S \"navigate\\(|href=|@click=|onClick\" file_editor_plus/frontend/src/app-root.ts"
    notes: "Inventario grezzo usato per compilare `AI/AUDITS/UI_NAV_AUDIT.md` nello STEP 003."

  - step_id: "UI_NAV_AUDIT-STEP-002"
    summary: "Mappati servizi FE ed endpoint BE per collegare le voci UI (Topbar/Sidebar) alle azioni reali."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
      - "file_editor_plus/frontend/src/services/api.ts"
      - "file_editor_plus/frontend/src/features/system/system.ts"
      - "file_editor_plus/backend/app.py"
    commands:
      - "rg -n \"export const api|export type .*Payload\" file_editor_plus/frontend/src/services/api.ts"
      - "rg -n \"@app\\.(get|post|put|delete)\\(\\\"/api\" file_editor_plus/backend/app.py"
    notes: "Base per il report STEP 003 e per wiring STEP 004 (evitare URL assoluti; usare apiBase + /api/*)."

  - step_id: "AI_TASKS_POST_MIGRATION-001"
    summary: "Frontend: reso `npm run -s typecheck` green (typing Vite env + fix tipizzazioni locali)."
    files:
      - "file_editor_plus/frontend/src/app-root.ts"
      - "file_editor_plus/frontend/src/vite-env.d.ts"
      - "file_editor_plus/frontend/src/features/entities/entities.ts"
      - "file_editor_plus/frontend/src/features/search/search.ts"
      - "file_editor_plus/frontend/src/features/tree/tree.ts"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "cd file_editor_plus/frontend && npm run -s typecheck"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Nessun cambio di behavior: solo correzioni tipizzazione/strict TS per abilitare quality gate typecheck."

  - step_id: "AI_TASKS_POST_MIGRATION-002"
    summary: "Runbook: comando canonico per test backend via Docker (unittest) per evitare dipendenze dal python host."
    files:
      - "AI/AI_RUNBOOK.md"
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "docker run --rm -v \"$PWD/file_editor_plus/backend:/app\" -w /app python:3.12-alpine sh -lc \"python -m pip install -r requirements.txt >/dev/null && python -m unittest -q\""
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "I test backend sono `unittest` (`file_editor_plus/backend/test_*.py`). Il runner locale resta opzionale, ma quello documentato e' ripetibile via container."

  - step_id: "AI_TASKS_POST_MIGRATION-003"
    summary: "AI kit: rimossi BOM UTF-8 da tutti i file Markdown/YAML sotto `AI/` per robustezza tooling."
    files:
      - "AI/**/*.md"
      - "AI/**/*.yaml"
      - "AI/KNOWLEDGE.yaml"
    commands:
      - "python3 script: strip BOM on AI/**/*.md + AI/**/*.yaml"
      - "python3 script: verify 0 BOM remaining"
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "Modifica non funzionale: solo rimozione BOM (nessun contenuto alterato oltre ai primi 3 byte)."

  - step_id: "AI_TASKS_POST_MIGRATION-004"
    summary: "Knowledge: rimossi TODO stale (owner/created_at) dalla knowledge."
    files:
      - "AI/AI_TASKS.md"
      - "AI/KNOWLEDGE.yaml"
      - "AI/METADATA.yaml"
    commands:
      - "rg -n \"todos_remaining|owner|created_at\" AI/KNOWLEDGE.yaml AI/METADATA.yaml -S"
      - "cd file_editor_plus/frontend && npm ci"
      - "cd file_editor_plus/frontend && npm run -s build"
    notes: "La source of truth e' `AI/KNOWLEDGE.yaml`."
