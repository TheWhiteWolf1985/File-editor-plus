project:
  name: ha-file-editor-plus
  root: /mnt/supervisor/addons/local/ha-file-editor-plus
  stack:
    frontend: Lit + TypeScript + Vite
    backend: FastAPI (Python)
  addon:
    slug: file_editor_plus
    current_version: "0.2.80"

frontend:
  entrypoints:
    - file_editor_plus/frontend/src/main.ts
    - file_editor_plus/frontend/src/app-root.ts
  topbar:
    component: file_editor_plus/frontend/src/app-root.ts
    menu_handler: handleMenuAction
  theme:
    host_attribute: data-theme
    resolved_in: file_editor_plus/frontend/src/app-root.ts
    palette_applied_in: file_editor_plus/frontend/src/features/settings/settings.ts

backend:
  app: file_editor_plus/backend/app.py
  static_serving:
    assets_mount: /assets
    frontend_mount: /frontend
    spa_fallback_route: /{full_path:path}

epics:
  documentation_base:
    source_of_truth: .temp/document.md
    status: completed
    last_completed_step: 5
    decisions:
      - "Step 0 completed: topbar/help wiring and theme handling mapped from app-root."
      - "Step 1 decision: use backend-served docs routes (/docs + /docs/{page}.md) instead of SPA routing."
      - "Step 2 completed: docs markdown corpus created under file_editor_plus/docs."
      - "Step 3 completed: backend docs viewer route implemented with local markdown rendering and theme sync."
      - "Step 4 completed: Help -> Docs now opens ./docs/ in a new tab with noopener,noreferrer."
      - "Step 5 completed: build/rebuild/restart executed and QA report generated."
    planned_files:
      - file_editor_plus/backend/app.py
      - file_editor_plus/frontend/src/app-root.ts
      - file_editor_plus/docs/index.md
      - file_editor_plus/docs/editor.md
      - file_editor_plus/docs/files.md
      - file_editor_plus/docs/settings.md
      - file_editor_plus/docs/system.md
      - file_editor_plus/docs/troubleshooting.md
      - file_editor_plus/Dockerfile
    docs_runtime:
      backend_routes:
        - /docs
        - /docs/{page}.md
      source_dir: /app/docs
      help_menu_link: window.open(new URL('./docs/', window.location.href), '_blank', 'noopener,noreferrer')
      theme_source:
        - /api/user-config theme_mode
        - prefers-color-scheme fallback
    docs_pages:
      - file_editor_plus/docs/index.md
      - file_editor_plus/docs/editor.md
      - file_editor_plus/docs/files.md
      - file_editor_plus/docs/settings.md
      - file_editor_plus/docs/system.md
      - file_editor_plus/docs/troubleshooting.md
    reports:
      - .temp/docs_repo_map.md
      - .temp/docs_step1_decision.md
      - .temp/docs_test_report.md
  documentation_i18n:
    source_of_truth: .temp/document.md
    status: in_progress
    last_completed_step: 4
    decisions:
      - "Step 1: migrated docs to docs/it/* and created placeholder sets for en/fr/es/de."
      - "Temporary compatibility: /docs/{page}.md now serves docs/it/{page}.md pending lang-aware route in Step 2/3."
      - "Step 2: docs viewer now supports query contract ?page=<slug>&lang=<code> with whitelist and lang-preserving nav links."
      - "Step 3: viewer uses loadDoc(page, lang) with fallback lang->en->it and backend route /docs/{lang}/{page}.md."
      - "Step 4: Help->Documentation now passes page=index and current user lang in query string."
    routes_current:
      - /docs
      - /docs/{lang}/{page}.md
      - /docs/{page}.md (legacy it alias)
    docs_layout_current: file_editor_plus/docs/<lang>/*.md
    language_source:
      i18n_file: file_editor_plus/frontend/src/i18n/index.ts
      storage_key: locale
      supported: [it, en, de, fr, es]
    menu_wiring:
      file: file_editor_plus/frontend/src/app-root.ts
      function: openDocumentation
      opens: ./docs/?page=index&lang=<userLang>
    reports:
      - .temp/docs_i18n_repo_map.md
      - .temp/docs_i18n_test_report.md
