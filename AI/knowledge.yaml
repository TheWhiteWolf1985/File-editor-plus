      - "Salva: chiude dopo save; Non salvare: chiude senza save; Annulla: tab resta aperta"
      - "rg -n \"appVersion\" file_editor_plus/frontend/src/app-root.ts"
      - "rg -n \"version:\" file_editor_plus/config.yaml"
  - date: "2026-01-12"
    actor: "codex"
    version: "0.2.14"
    change: "Compatibilità: preparazione release multi-arch includendo ARM64/aarch64."
    reason: "Allineare la matrice di build/distribuzione ai target ARM64."
    touched_files:
      - "file_editor_plus/frontend/src/app-root.ts"
      - "file_editor_plus/config.yaml"
      - "file_editor_plus/CHANGELOG.md"
      - "AI/knowledge.yaml"
    verification:
      - "rg -n \"appVersion\" file_editor_plus/frontend/src/app-root.ts"
      - "rg -n \"version:\" file_editor_plus/config.yaml"
      - "head -n 20 file_editor_plus/CHANGELOG.md"
  - date: "2026-01-12"
