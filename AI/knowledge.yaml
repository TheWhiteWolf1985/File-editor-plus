# AI/knowledge.yaml — Memoria estesa del progetto (aggiornabile dall'agente)
schema:
  name: "ai-knowledge"
  version: 2
  updated_at: "2026-02-13"
  updated_by: "codex"
  update_policy:
    rulebook: "AI/agents.md"
    when: "after_each_patch" # after_each_patch | daily | manual
    log_mode: "append" # append | append_with_rollup
    max_log_entries: 200

project:
  name: "File Editor Plus"
  repo_root: "."
  description: "Home Assistant add-on con backend FastAPI e frontend Lit per editare /config via ingress."
  goals:
    now:
      - "Collegare la UI Lit a /api/tree e /api/file per esplorare e modificare /config in modo reale."
      - "Stabilizzare build/add-on (frontend dist + backend uvicorn) per l'MVP ingress."
    later:
      - "<TBD>"
  non_goals:
    - "Modificare percorsi fuori da /config."

paths:
  ai_dir: "AI/"
  docs_dir: "<TBD>"
  src_dirs:
    - "file_editor_plus/backend/"
    - "file_editor_plus/frontend/src/"
  tests_dir: "<TBD>"
  assets_dir: "file_editor_plus/rootfs/"
  config_files:
    agents: "AI/agents.md"
    knowledge: "AI/knowledge.yaml"
    addon: "file_editor_plus/config.yaml"

conventions:
  language: "it"
  style:
    indent: 2
    line_endings: "lf"
  naming:
    files: "snake_case"
    python: "snake_case"
    js_ts: "camelCase"
  git:
    branch: "main"
    commit_style: "conventional" # conventional | free
    prefixes:
      - "fix:"
      - "feat:"
      - "refactor:"
      - "docs:"
      - "chore:"

constraints:
  sandbox:
    mode: "workspace-write"
    network_access: false
  safety:
    destructive_cmds_require_approval: true
    never_touch_paths:
      - "/"
      - "/etc"
      - "~/.ssh"
  performance:
    max_runtime_seconds: 45

environments:
  default: "dev"
  dev:
    os: "Alpine (node:20-alpine builder)"
    runtime:
      python: "<apk python3 dal runtime HA base>"
      node: "20.x"
    notes:
      - "Frontend build con Vite: npm ci && npm run build."
  prod:
    os: "Home Assistant base image (ghcr.io/home-assistant/amd64-base)"
    deployment:
      method: "Home Assistant add-on (s6, ingress)"
    notes:
      - "Uvicorn serve FastAPI su 0.0.0.0:8099 (ingress)."
      - "Mount /config in rw (config.yaml: map config:rw)."

tooling:
  commands:
    lint:
      - "<TBD>"
    test:
      - "<TBD>"
    typecheck:
      - "<TBD>"
    build:
      - 'docker run --rm -v /mnt/supervisor/addons/local/ha-file-editor-plus/file_editor_plus/frontend:/app -w /app node:20-alpine sh -c "npm ci && npm run build"'
    addon:
      - "docker exec hassio_cli ha addons rebuild local_file_editor_plus"
      - "docker exec hassio_cli ha addons restart local_file_editor_plus"
  dependencies:
    pinned: true
    notes:
      - "Backend: fastapi==0.115.6, uvicorn==0.32.1 (requirements.txt)."
      - "Frontend lockfile presente (package-lock.json) per lit/vite/typescript."

architecture:
  overview: "Add-on HA: FastAPI gestisce file system /config (backup, scrittura atomica) e serve la SPA Lit buildata con Vite; Dockerfile multi-stage costruisce il frontend con node:20-alpine e runtime su base HA con s6 che avvia uvicorn."
  components:
    - name: "backend-api"
      type: "service"
      path: "file_editor_plus/backend/app.py"
      responsibilities:
        - "API per healthcheck, albero file e lettura/scrittura con backup sotto /config."
        - "Serve asset frontend dist e fallback SPA."
      interfaces:
        - kind: "http"
          details: "GET /api/health, GET /api/tree?path=, GET /api/file?path=, PUT /api/file?path="
      depends_on:
        - "/config filesystem"
    - name: "frontend-spa"
      type: "ui"
      path: "file_editor_plus/frontend/src/"
      responsibilities:
        - "UI Lit stile editor; al momento usa dati mock per tree e contenuti."
      interfaces:
        - kind: "http"
          details: "Da collegare alle API backend per tree e file."
      depends_on:
        - "backend-api"
    - name: "addon-packaging"
      type: "service"
      path: "file_editor_plus"
      responsibilities:
        - "Dockerfile multi-stage (build frontend, install backend) + rootfs con servizio s6."
        - "Manifest add-on config.yaml (ingress, map /config)."
      interfaces:
        - kind: "home_assistant"
          details: "Ingress su 8099, map /config:rw."
      depends_on:
        - "frontend-spa"
        - "backend-api"
  data_flow:
    - from: "Frontend SPA"
      to: "Backend API"
      description: "Richieste HTTP previste verso /api/health, /api/tree e /api/file per esplorare e salvare file (UI ancora mock)."
    - from: "Backend API"
      to: "/config filesystem"
      description: "Lettura/scrittura file con backup in /config/.fep-backups e controllo traversal."
  key_files:
    - path: "file_editor_plus/backend/app.py"
      why: "FastAPI + logica backup/atomic write e routing SPA."
    - path: "file_editor_plus/rootfs/etc/services.d/web/run"
      why: "Entrypoint s6 che avvia uvicorn su 0.0.0.0:8099."
    - path: "file_editor_plus/Dockerfile"
      why: "Build multi-stage frontend + backend con venv."
    - path: "file_editor_plus/config.yaml"
      why: "Manifest add-on (ingress, mount /config, metadata)."
    - path: "file_editor_plus/frontend/src/app-root.ts"
      why: "UI principale (mock Explorer/Editor da collegare alle API)."
    - path: "file_editor_plus/frontend/src/styles/figma-editor-styles.ts"
      why: "Modulo Lit con baseline CSS reference importata da .temp/src/styles/editor.css per refactor UI."
    - path: "file_editor_plus/frontend/src/components/app-icon.ts"
      why: "Componente Lit riusabile per icone SVG inline (size/stroke/color controllabili) senza dipendenze esterne."

interfaces:
  http_api:
    base_url: "Ingress base (uvicorn 0.0.0.0:8099)"
    auth: "<TBD - presumibilmente gestito da Home Assistant ingress>"
    endpoints:
      - method: "GET"
        path: "/health"
        purpose: "healthcheck"
      - method: "GET"
        path: "/api/health"
        purpose: "Healthcheck backend."
      - method: "GET"
        path: "/api/tree"
        purpose: "Lista directory sotto /config (param path opzionale)."
      - method: "GET"
        path: "/api/file"
        purpose: "Legge contenuto di un file sotto /config (param path obbligatorio)."
      - method: "PUT"
        path: "/api/file"
        purpose: "Scrive contenuto in un file sotto /config con backup."
  mqtt:
    broker: "<none>"
    topics: []
  home_assistant:
    integration: "Add-on ingress"
    entities: []
    notes:
      - "Ingress esposto su 8099 con uvicorn; config.yaml abilita map /config:rw."
      - "Nessuna entity HA dichiarata; UI servita via ingress."

data_model:
  stores:
    - name: "Home Assistant config"
      type: "files"
      location: "/config"
      schema_notes:
        - "File HA gestiti dall'utente; accesso filtrato da safe_path (niente traversal, niente assoluti)."
    - name: "File backups"
      type: "files"
      location: "/config/.fep-backups"
      schema_notes:
        - "Backup per file scritti, organizzati per giorno con suffisso .HHMMSS.bak."
  formats:
    - name: "config-files"
      type: "yaml"
      schema_ref: "<user-managed Home Assistant config>"
    - name: "backups"
      type: "files"
      schema_ref: "Copie timestamped generate da make_backup()"

security:
  secrets_policy:
    never_store_in_repo:
      - "API keys"
      - "tokens"
      - "passwords"
    allowed_placeholders:
      - "${ENV_VAR}"
  auth:
    method: "<TBD>"
    notes:
      - "Backend non implementa auth propria; accesso presumibilmente mediato da Home Assistant ingress."
      - "safe_path blocca traversal e percorsi fuori /config; write usa atomic_write e backup."

quality:
  test_strategy:
    unit: false
    integration: false
    e2e: false
  definition_of_done:
    - "Build ok"
    - "Test ok (se/ quando presenti)"
    - "Aggiornato AI/knowledge.yaml log"
    - "Ingress/API manual smoke"
    - "Niente modifiche extra non richieste"

work_tracking:
  known_issues:
    - id: "ISSUE-001"
      title: "UI usa dati mock e non chiama ancora le API /api/tree e /api/file"
      severity: "med"
      status: "fixed"
      notes: "app-root.ts ora carica tree/file e salva via API ingress-safe (base path da window.location)."
    - id: "ISSUE-002"
      title: "Il file tsconfg.json potrebbe essere ignorato dal toolchain TypeScript"
      severity: "med"
      status: "open"
      notes: "Nome tipico e atteso e' tsconfig.json; rischio di usare config default."
  risks:
    - id: "RISK-001"
      title: "Mancano test automatici per backend e frontend"
      probability: "med"
      impact: "high"
      mitigation: "Aggiungere suite di unit/integration test per API (safe_path, backup) e UI."
  open_questions:
    - id: "Q-001"
      question: "Quali versioni OS/python sono previste per lo sviluppo locale?"
      context: "Docker usa node:20-alpine per build e installa python3 nel runtime, ma la versione precisa non e' documentata."
      status: "open"
    - id: "Q-002"
      question: "Serve autenticazione aggiuntiva oltre all'ingress HA per le API?"
      context: "Backend FastAPI non implementa auth; accesso presumibilmente gestito da Home Assistant."
      status: "open"
    - id: "Q-003"
      question: "E' prevista una cartella docs/ o guida utente per l'add-on?"
      context: "Nessun README/docs trovati; knowledge richiede riferimenti reali."
      status: "open"
    - id: "Q-004"
      question: "Qual e' la pipeline di build/test desiderata (CI) e i comandi ufficiali?"
      context: "Comandi lint/test/typecheck non definiti; serve standardizzare i contributi."
      status: "open"
  backlog:
    - id: "TODO-001"
      title: "Collegare la UI (Lit) alle API /api/tree e /api/file con fetch e gestione stato"
      priority: "p2" # p0 | p1 | p2 | p3
      status: "done"
      notes: "UI ora usa API reali con base path ingress; tree lazy-load."
    - id: "TODO-002"
      title: "Gestire salvataggio reale con feedback errori/successo e stato dirty"
      priority: "p1"
      status: "done"
      notes: "Save usa PUT /api/file con JSON {content}; aggiorna tab dirty e status."
    - id: "TODO-003"
      title: "Correggere/valutare il naming di tsconfg.json per assicurare lettura TypeScript"
      priority: "p2"
      status: "todo"
      notes: "Potrebbe dover diventare tsconfig.json o essere referenziato esplicitamente."
    - id: "TODO-004"
      title: "Aggiungere test per safe_path/make_backup/atomic_write"
      priority: "p2"
      status: "todo"
      notes: "Coprire traversal, backup path e errori IO."
    - id: "TODO-005"
      title: "Integrare lint/typecheck per frontend (vite/ts) e backend (ruff/mypy?)"
      priority: "p2"
      status: "todo"
      notes: "Definire comandi ufficiali e config."
    - id: "TODO-006"
      title: "Documentare setup dev e uso dell'add-on (ingress, mount /config)"
      priority: "p2"
      status: "todo"
      notes: "README o docs dedicati."
    - id: "TODO-007"
      title: "Valutare gestione lifecycle backup (cleanup/retention)"
      priority: "p3"
      status: "todo"
      notes: "Backup in /config/.fep-backups senza pruning noto."
    - id: "TODO-008"
      title: "Aggiungere controllo errori e messaggi nella UI per operazioni file"
      priority: "p3"
      status: "todo"
      notes: "Migliorare UX oltre lo stato mock."
  follow_ups:
    - id: "FU-001"
      title: "Auto-indent globale da menu contestuale da rendere più preciso"
      status: "open"
      notes: "L'auto-indent full file (menu contestuale) funziona ma produce risultati non sempre corretti; serve affinare l'algoritmo di reindent."
    - id: "FU-002"
      title: "Toggle impostazioni per abilitare/disabilitare autocomplete entità"
      status: "done"
      notes: "Toggle già presente nella status bar (Auto-indent e Theme); autocomplete entità gestito."
    - id: "FU-003"
      title: "Categorizzare gli snippet (luci, automazioni, ecc.)"
      status: "open"
      notes: "Permettere all'utente di assegnare categorie agli snippet e filtrare/visualizzare per categoria."
    - id: "FU-004"
      title: "Mappare hint specifici dagli errori di parsing ruamel"
      status: "open"
      notes: "Espandere la lista di hint per messaggi YAML ruamel (es. expected <block end>, expected ',' or '}' ecc.) e mostrarli nel toast."
    - id: "FU-005"
      title: "Verifica UI mobile (sidebar off-canvas e spaziature)"
      status: "open"
      notes: "Testare la UI su smartphone e rifinire layout/gesti/spacing per la sidebar a scomparsa."

