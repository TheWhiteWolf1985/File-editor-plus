    actor: "codex"
    version: "0.2.2"
    change: "Editor: Tab/Shift+Tab ora indenta/outdenta selezioni senza cancellare testo; mantiene selezione e sincronizza overlay."
    reason: "Fix comportamento della textarea che cancellava il testo selezionato premendo Tab."
    touched_files:
