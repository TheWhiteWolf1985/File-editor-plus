name: PreRelease (build + publish to PreRelease)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref da pubblicare (branch/tag/sha). Default: develop"
        required: false
        default: "develop"
        type: string

  push:
    branches:
      - develop

jobs:
  build_fe_multiarch:
    name: Build FE stage (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only (no push). This validates the FE build across architectures.
      - name: Build FE stage for amd64/arm64/armv7
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --build-arg BUILD_FROM=alpine:3.20 \
            --target fe \
            -f file_editor_plus/Dockerfile \
            --progress plain \
            .

  publish_prerelease_branch:
    name: Publish release tree to PreRelease
    runs-on: ubuntu-latest
    needs: [build_fe_multiarch]
    permissions:
      contents: write
    steps:
      - name: Checkout (same ref as build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Build release tree
        run: |
          rm -rf /tmp/prerelease
          mkdir -p /tmp/prerelease
          rsync -a --delete \
            --include "/repository.json" \
            --include "/.github/" \
            --include "/.github/workflows/" \
            --include "/.github/workflows/***" \
            --include "/file_editor_plus/***" \
            --exclude "/*" \
            ./ /tmp/prerelease/

      - name: Publish to PreRelease
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin PreRelease || true
          # Create PreRelease branch if it doesn't exist yet
          if git show-ref --verify --quiet refs/remotes/origin/PreRelease; then
            git checkout -B PreRelease origin/PreRelease
          else
            git checkout -B PreRelease
          fi

          git rm -r --quiet . || true
          rsync -a --delete --exclude "/.git" /tmp/prerelease/ ./
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish to PreRelease."
            exit 0
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          git commit -m "prerelease: ${SHORT_SHA}"
          git push origin PreRelease
