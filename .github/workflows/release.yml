name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione release (es. 0.1.70)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: file_editor_plus/frontend/package-lock.json

      - name: Verify version matches config.yaml
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          version = "${{ inputs.version }}".strip()
          if not version:
            print("Missing version input", file=sys.stderr)
            sys.exit(1)

          text = Path("file_editor_plus/config.yaml").read_text(encoding="utf-8")
          match = re.search(
            r'^\s*version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$',
            text,
            re.MULTILINE,
          )
          if not match:
            print("Version not found in file_editor_plus/config.yaml", file=sys.stderr)
            sys.exit(1)

          cfg_version = match.group(1)
          if cfg_version != version:
            print(f"Version mismatch: input={version}, config.yaml={cfg_version}", file=sys.stderr)
            sys.exit(1)

          print(f"config.yaml Version OK: {version}")
          PY

      - name: Build frontend (release check)
        run: |
          cd file_editor_plus/frontend
          npm ci
          npm run build

      - name: Verify built frontend contains version
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          version = "${{ inputs.version }}".strip()
          dist = Path("file_editor_plus/frontend/dist")

          if not dist.exists():
            print("Missing file_editor_plus/frontend/dist after build", file=sys.stderr)
            sys.exit(1)

          hits = []
          for p in dist.rglob("*"):
            if p.is_file() and p.suffix in (".js", ".css", ".map", ".html"):
              try:
                data = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                continue
              if version in data:
                hits.append(str(p))

          if not hits:
            print(f"Version string '{version}' NOT found in built dist output", file=sys.stderr)
            print("This usually means the frontend version is not being injected at build-time.", file=sys.stderr)
            sys.exit(1)

          print(f"Built frontend contains version '{version}' in {len(hits)} file(s).")
          PY

      - name: Build release tree
        run: |
          rm -rf /tmp/release
          mkdir -p /tmp/release
          rsync -a --delete \
            --include "/repository.json" \
            --include "/.github/" \
            --include "/.github/workflows/" \
            --include "/.github/workflows/***" \
            --include "/file_editor_plus/***" \
            --exclude "/*" \
            ./ /tmp/release/

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm -r --quiet .
          rsync -a --delete --exclude "/.git" /tmp/release/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to release."
            exit 0
          fi
          git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}" || true
          git push origin main --tags
