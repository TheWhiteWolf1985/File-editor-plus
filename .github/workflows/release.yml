name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione release (es. 0.1.78)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Verify version matches files
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          version = "${{ inputs.version }}".strip()
          if not version:
            print("Missing version input", file=sys.stderr)
            sys.exit(1)

          def read_version(path: str, pattern: str) -> str:
            text = Path(path).read_text(encoding="utf-8")
            match = re.search(pattern, text, re.MULTILINE)
            if not match:
              print(f"Version not found in {path}", file=sys.stderr)
              sys.exit(1)
            return match.group(1)

          cfg_version = read_version(
            "file_editor_plus/config.yaml",
            r'^\s*version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$',
          )
          app_version = read_version(
            "file_editor_plus/frontend/src/app-root.ts",
            r'appVersion\s*=\s*"([^"]+)"',
          )

          if cfg_version != version or app_version != version:
            print(
              f"Version mismatch: input={version}, config.yaml={cfg_version}, app-root.ts={app_version}",
              file=sys.stderr,
            )
            sys.exit(1)
          print(f"Version OK: {version}")
          PY

      - name: Build release tree
        run: |
          rm -rf /tmp/release
          mkdir -p /tmp/release
          rsync -a --delete \
            --include "/repository.json" \
            --include "/.github/" \
            --include "/.github/workflows/" \
            --include "/.github/workflows/***" \
            --include "/file_editor_plus/***" \
            --exclude "/*" \
            ./ /tmp/release/

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm -r --quiet .
          rsync -a --delete --exclude "/.git" /tmp/release/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to release."
            exit 0
          fi
          git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}" || true
          git push origin main --tags
