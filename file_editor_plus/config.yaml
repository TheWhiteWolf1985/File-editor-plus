name: "File Editor Plus"
version: "1.0.0"
slug: "file_editor_plus"
description: "Pro File Editor for Home Assistant"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: admin

ingress: true
ingress_port: 8099
ingress_panel: true
panel_title: File Editor Plus
ports:
  8099/tcp: null
panel_icon: "mdi:file-document-edit-outline"

map:
  - config:rw

options:
  gdrive_client_id: ""
  gdrive_client_secret: ""
  gdrive_redirect_uri: ""
  gdrive_redirect_override: ""
  public_base_url: ""
  addon_callback_port: 8099

schema:
  gdrive_client_id: str
  gdrive_client_secret: str
  gdrive_redirect_uri: str
  gdrive_redirect_override: str
  public_base_url: str
  addon_callback_port: int(1,65535)
